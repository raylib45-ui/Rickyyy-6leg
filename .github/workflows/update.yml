name: Auto Update Board

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run updater script
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas
          python update_board.py || echo "No updater script found yet"

      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_board.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live player props board [skip ci]" && git push)
